<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>曲乐瑶的24大寿派对 🎂</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow: hidden;
    }

    /* 更大、更稀疏、更多彩的波点背景 */
    .polka-bg {
      background-color: #fff7e0;
      background-image:
        radial-gradient(#ff6fa5 22px 22px, transparent 24px),
        radial-gradient(#ffd93d 20px 20px, transparent 22px),
        radial-gradient(#6fd3ff 21px 21px, transparent 23px),
        radial-gradient(#c792ff 20px 20px, transparent 22px),
        radial-gradient(#8be26a 19px 19px, transparent 21px),
        radial-gradient(#ff9a3c 20px 20px, transparent 22px);
      background-size: 80px 80px, 95px 95px, 70px 70px, 90px 90px, 75px 75px, 85px 85px;
      background-position: 0 0, 30px 20px, 10px 40px, 45px 10px, 20px 45px, 35px 25px;
    }

    /* 页面容器 */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      min-height: 100vh;
      padding: 80px 24px 40px;
      animation: fadeIn 0.45s ease-out;
      position: relative;
      z-index: 1;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(24px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 返回按钮 */
    .back-btn {
      position: absolute;
      top: 22px;
      left: 18px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      color: #ff4fa3;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 18px rgba(255, 105, 180, 0.25);
      border: none;
      cursor: pointer;
    }

    .back-btn.hidden {
      display: none;
    }

    /* 首页标题 */
    .home-title {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 900;
      color: #ff2d7a;
      text-shadow:
        3px 3px 0 #ffd93d,
        6px 6px 0 #6fd3ff;
      letter-spacing: 1px;
      z-index: 10;
    }

    .home-subtitle {
      margin-top: 14px;
      font-size: 1.05rem;
      color: #7b2cbf;
      font-weight: 700;
      z-index: 10;
    }

    /* 按钮 */
    .btn-primary {
      margin-top: 40px;
      width: min(320px, 86%);
      background: linear-gradient(135deg, #ff5fa8, #ffb347, #ffd93d);
      color: white;
      border: none;
      padding: 16px 22px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(255, 90, 160, 0.35);
      cursor: pointer;
      z-index: 10;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* 漂浮图片容器 */
    .floating-photos {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .float-photo {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 24px;
      border: 4px solid white;
      box-shadow: 0 10px 24px rgba(255, 105, 180, 0.35);
      object-fit: cover;
      animation: floatAround linear infinite;
    }

    @keyframes floatAround {
      0% {
        transform: translate(0, 0) rotate(var(--r, 0deg));
      }
      25% {
        transform: translate(var(--dx1, 20px), var(--dy1, -25px)) rotate(var(--r1, 6deg));
      }
      50% {
        transform: translate(var(--dx2, -18px), var(--dy2, 18px)) rotate(var(--r2, -5deg));
      }
      75% {
        transform: translate(var(--dx3, 22px), var(--dy3, 22px)) rotate(var(--r3, 4deg));
      }
      100% {
        transform: translate(0, 0) rotate(var(--r, 0deg));
      }
    }

    /* 装饰 emoji */
    .emoji-deco {
      position: absolute;
      font-size: 28px;
      z-index: 3;
      animation: gentleMove 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes gentleMove {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 信息卡片 */
    .info-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 30px;
      padding: 28px 24px;
      width: min(340px, 86%);
      box-shadow: 0 12px 30px rgba(123, 44, 191, 0.25);
      text-align: center;
      z-index: 10;
    }

    .info-card h2 {
      font-size: 1.7rem;
      color: #7b2cbf;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .info-card p {
      font-size: 1.1rem;
      color: #444;
      margin: 10px 0;
      font-weight: 600;
    }

    /* 选择按钮区 */
    .choice-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(320px, 86%);
      margin-top: 10px;
      z-index: 10;
    }

    .choice-btn {
      border: none;
      border-radius: 999px;
      padding: 16px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 105, 180, 0.3);
    }

    .choice-btn.yes {
      background: linear-gradient(135deg, #4ade80, #38bdf8);
    }

    .choice-btn.no {
      background: linear-gradient(135deg, #a78bfa, #f472b6);
    }

    .choice-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body class="polka-bg">

  <!-- 返回按钮 -->
  <button class="back-btn hidden" id="backBtn">← 返回</button>

  <!-- 漂浮图片层 -->
  <div class="floating-photos" id="floatingPhotos"></div>

  <!-- 首页 -->
  <section class="page active" id="page1">
    <h1 class="home-title">🎂 欢迎来到曲乐瑶的24大寿party 🥳</h1>
    <p class="home-subtitle">期待和你一起，把这一天变成甜甜的彩色回忆 ✨</p>

    <button class="btn-primary" onclick="nextPage()">
      确认，继续查看 →
    </button>
  </section>

  <!-- 时间地点页 -->
  <section class="page" id="page2">
    <div class="info-card">
      <h2>📍 聚会信息</h2>
      <p>📅 日期：2026年11月11日</p>
      <p>⏰ 时间：下午14:00 开始</p>
      <p>🏠 地点：XX市XX区XX路XX号</p>
      <p style="margin-top:14px;color:#ff4fa3;">等你一起吃蛋糕、拍照、玩游戏！</p>
    </div>

    <button class="btn-primary" onclick="nextPage()">
      确认，下一步 →
    </button>
  </section>

  <!-- 是否参加页 -->
  <section class="page" id="page3">
    <div class="info-card" style="margin-bottom:12px;">
      <h2>🎉 你可以来吗？</h2>
      <p>请选择你的出席状态</p>
    </div>

    <div class="choice-buttons">
      <button class="choice-btn yes" onclick="selectJoin()">✅ 我会参加！</button>
      <button class="choice-btn no" onclick="selectNoJoin()">❌ 很遗憾无法到场</button>
    </div>
  </section>

  <script>
    const totalPage = 3;
    let currentPage = 1;
    const backBtn = document.getElementById("backBtn");

    // 首页漂浮图片生成
    function initFloatingPhotos() {
      const container = document.getElementById("floatingPhotos");
      container.innerHTML = "";

      const imgCount = 4;
      const imgUrls = [
        "https://picsum.photos/id/1025/200/200",
        "https://picsum.photos/id/1062/200/200",
        "https://picsum.photos/id/1074/200/200",
        "https://picsum.photos/id/1084/200/200"
      ];

      for (let i = 0; i < imgCount; i++) {
        const img = document.createElement("img");
        img.src = imgUrls[i];
        img.className = "float-photo";
        img.alt = "photo";

        // 随机初始位置，避开中间文字区域
        const left = Math.random() * 70 + 5 + "%";
        const top = Math.random() * 60 + 15 + "%";
        img.style.left = left;
        img.style.top = top;

        // 随机漂浮参数
        const dx1 = (Math.random() * 40 - 20);
        const dy1 = (Math.random() * 40 - 20);
        const dx2 = (Math.random() * 40 - 20);
        const dy2 = (Math.random() * 40 - 20);
        const dx3 = (Math.random() * 40 - 20);
        const dy3 = (Math.random() * 40 - 20);
        const duration = 10 + Math.random() * 8;
        const delay = Math.random() * 4;

        img.style.setProperty("--dx1", dx1 + "px");
        img.style.setProperty("--dy1", dy1 + "px");
        img.style.setProperty("--dx2", dx2 + "px");
        img.style.setProperty("--dy2", dy2 + "px");
        img.style.setProperty("--dx3", dx3 + "px");
        img.style.setProperty("--dy3", dy3 + "px");
        img.style.animationDuration = duration + "s";
        img.style.animationDelay = delay + "s";

        container.appendChild(img);
      }
    }

    // 页面渲染
    function renderPage() {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + currentPage).classList.add("active");

      if (currentPage === 1) {
        backBtn.classList.add("hidden");
      } else {
        backBtn.classList.remove("hidden");
      }
    }

    function nextPage() {
      if (currentPage < totalPage) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    }

    function selectJoin() {
      alert("🎉 太棒啦！正式版会进入主题选择页面。");
    }

    function selectNoJoin() {
      alert("🥺 收到你的回复，期待下次见面！正式版会直接跳转到结束感谢页。");
    }

    backBtn.addEventListener("click", prevPage);
    initFloatingPhotos();
  </script>
</body>
</html>
