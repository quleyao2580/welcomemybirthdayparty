<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>曲乐瑶的24大寿派对 🎂</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
      overflow: hidden;
    }

    /* 稀疏、不重合、更简单的波点背景 */
    .polka-bg {
      background-color: #fffbe8;
      background-image:
        radial-gradient(#4fb8ff 18px 18px, transparent 20px),
        radial-gradient(#57d9a3 17px 17px, transparent 19px),
        radial-gradient(#ffd93d 16px 16px, transparent 18px),
        radial-gradient(#ff5c8a 15px 15px, transparent 17px);
      background-size: 120px 120px, 140px 140px, 130px 130px, 150px 150px;
      background-position: 0 0, 60px 40px, 30px 70px, 80px 20px;
    }

    /* 页面 */
    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      min-height: 100vh;
      padding: 90px 20px 50px;
      animation: fadeIn 0.45s ease-out;
      position: relative;
      z-index: 1;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(24px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 返回按钮 */
    .back-btn {
      position: absolute;
      top: 22px;
      left: 18px;
      z-index: 60;
      background: rgba(255, 255, 255, 0.92);
      color: #2f80ed;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 18px rgba(79, 184, 255, 0.3);
      border: none;
      cursor: pointer;
    }

    .back-btn.hidden {
      display: none;
    }

    /* 装饰层 */
    .decor-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .decor-emoji {
      position: absolute;
      font-size: 28px;
      animation: gentleFloat 4s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 首页圆弧标题 */
    .arc-title-wrap {
      position: relative;
      width: min(340px, 90%);
      height: 130px;
      margin: 10px auto 20px;
    }

    .arc-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
    }

    .home-subtitle {
      font-size: 1.05rem;
      color: #2f80ed;
      font-weight: 700;
      margin-top: 10px;
      z-index: 10;
    }

    /* 按钮 */
    .btn-primary {
      margin-top: 30px;
      width: min(320px, 86%);
      background: linear-gradient(135deg, #57d9a3, #4fb8ff, #ff5c8a);
      color: white;
      border: none;
      padding: 16px 22px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(79, 184, 255, 0.35);
      cursor: pointer;
      z-index: 10;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* 信息卡片 */
    .info-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 30px;
      padding: 28px 22px;
      width: min(350px, 88%);
      box-shadow: 0 14px 30px rgba(47, 128, 237, 0.25);
      text-align: center;
      z-index: 10;
      border: 3px solid #bde4ff;
    }

    .info-card h2 {
      font-size: 1.6rem;
      color: #2f80ed;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .info-card p {
      font-size: 1.04rem;
      color: #444;
      margin: 10px 0;
      font-weight: 700;
      line-height: 1.8;
    }

    /* 选择按钮 */
    .choice-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(330px, 86%);
      margin-top: 10px;
      z-index: 10;
    }

    .choice-btn {
      border: none;
      border-radius: 24px;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(79, 184, 255, 0.3);
    }

    .choice-btn.green-blue {
      background: linear-gradient(135deg, #57d9a3, #4fb8ff);
    }

    .choice-btn.pink-yellow {
      background: linear-gradient(135deg, #ff5c8a, #ffd93d);
    }

    .choice-btn.blue-purple {
      background: linear-gradient(135deg, #4fb8ff, #a78bfa);
    }

    .choice-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body class="polka-bg">

  <button class="back-btn hidden" id="backBtn">← 返回</button>

  <div class="decor-layer" id="decorLayer"></div>

  <!-- P1 首页 -->
  <section class="page active" id="page1">
    <div class="arc-title-wrap">
      <svg class="arc-title" viewBox="0 0 340 130" preserveAspectRatio="none">
        <defs>
          <path id="arcPath" d="M 20 120 Q 170 10 320 120" fill="none" />
        </defs>
        <text font-family="Microsoft YaHei, 微软雅黑, PingFang SC, sans-serif" font-size="24" font-weight="900" fill="#2f80ed">
          <textPath href="#arcPath" startOffset="50%" text-anchor="middle">
            欢迎来到曲乐瑶的24大寿~ 🎂🥳🎈
          </textPath>
        </text>
      </svg>
    </div>

    <p class="home-subtitle">可爱生日派对邀请函 · 等你一起玩</p>

    <button class="btn-primary" onclick="nextPage()">
      确认，继续查看 →
    </button>
  </section>

  <!-- P2 聚会时间地点 -->
  <section class="page" id="page2">
    <div class="info-card">
      <h2>🎂 聚会信息</h2>
      <p>诚邀您参加我的24大寿party！</p>
      <p>party地点：深圳市南山区崇文花园13栋2518</p>
      <p>（深大丽湖地铁站c口步行5分钟）</p>
      <p>party时间：2026年10月17日 12:00</p>
      <p style="color:#ff5c8a;margin-top:12px;">邀您一起吃蛋糕、聊天、玩游戏！</p>
    </div>

    <button class="btn-primary" onclick="nextPage()">
      确认，下一步 →
    </button>
  </section>

  <!-- P3 是否参加 -->
  <section class="page" id="page3">
    <div class="info-card">
      <h2>🎉 你会来吗？</h2>
      <p>请选择你的出席状态</p>
    </div>

    <div class="choice-buttons">
      <button class="choice-btn green-blue" onclick="selectJoin()">
        ✅ 【！必须到场！】
      </button>
      <button class="choice-btn pink-yellow" onclick="selectMaybe()">
        ？ 【我再考虑下嘛】
      </button>
      <button class="choice-btn blue-purple" onclick="selectNoJoin()">
        ❌ 【555很可惜已经有安排了~】
      </button>
    </div>
  </section>

  <script>
    const totalPage = 3;
    let currentPage = 1;
    const backBtn = document.getElementById("backBtn");

    // 装饰 emoji 随机生成
    function initDecorations() {
      const layer = document.getElementById("decorLayer");
      layer.innerHTML = "";
      const emojis = ["🎂", "🥳", "🎈", "⭐", "💛", "💙", "💚", "🎀", "🎁", "🍰"];

      for (let i = 0; i < 10; i++) {
        const span = document.createElement("span");
        span.className = "decor-emoji";
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 95 + "%";
        span.style.top = Math.random() * 95 + "%";
        span.style.fontSize = (22 + Math.random() * 14) + "px";
        span.style.animationDuration = (3.5 + Math.random() * 2) + "s";
        span.style.animationDelay = Math.random() * 3 + "s";
        layer.appendChild(span);
      }
    }

    function renderPage() {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + currentPage).classList.add("active");
      backBtn.classList.toggle("hidden", currentPage === 1);
    }

    function nextPage() {
      if (currentPage < totalPage) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    }

    function selectJoin() {
      alert("🎉 太棒啦！正式版会进入主题选择页。");
    }

    function selectMaybe() {
      alert("🤔 好的，那你可以先围观后面的选择题。");
    }

    function selectNoJoin() {
      alert("😢 555没办法下次再聚吧~~ 正式版会跳转到结束页A。");
    }

    backBtn.addEventListener("click", prevPage);
    initDecorations();
  </script>
</body>
</html>
